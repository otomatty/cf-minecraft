<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>cf-minecraft</title>
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;500;700&display=swap" />
		<style>
			* { box-sizing: border-box; }
			body { margin: 0; min-height: 100svh; background: #9cc2ef; color: #f4f7fb; font-family: "M PLUS 1p", "Hiragino Sans", sans-serif; font-size: 14px; }
			.background { position: fixed; inset: -4%; z-index: -2; background: url(/title-bg.jpg) center / cover; transform: translateX(-2.5%) scale(1.06); animation: panorama 60s ease-in-out alternate infinite; pointer-events: none; }
			.shade { position: fixed; inset: 0; z-index: -1; background: linear-gradient(to bottom, rgba(0,0,0,.18), rgba(0,0,0,.05) 40%, rgba(0,0,0,.55)); pointer-events: none; }
			@keyframes panorama { to { transform: translateX(2.5%) scale(1.06); } }
			main { min-height: 100svh; width: 100%; padding: 100px 24px 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
			.logo { text-align: center; max-width: 100%; }
			h1, h2, h3, .btn, .subtitle { font-family: "DotGothic16", monospace; font-weight: 400; }
			h1 { margin: 0; font-size: clamp(44px, 9vw, 76px); color: white; text-shadow: 4px 4px 0 #2d4a1c, 8px 8px 0 rgba(0,0,0,.35); overflow-wrap: anywhere; }
			.subtitle { color: #fff3c4; font-size: 16px; letter-spacing: 3px; margin: 16px 0 0; }
			.panel { width: min(420px, 100%); padding: 28px 32px; background: rgba(12,18,28,.78); border: 2px solid rgba(255,255,255,.2); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
			.panel.wide { width: min(880px, 100%); }
			.swap { animation: appear .32s ease-out; }
			@keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
			h2 { font-size: 24px; margin: 0; min-width: 0; overflow-wrap: anywhere; }
			h3 { margin: 4px 0; font-size: 40px; overflow-wrap: anywhere; }
			p { margin: 0; line-height: 1.8; overflow-wrap: anywhere; }
			button, input, select { font: inherit; border-radius: 0; }
			button, a { -webkit-tap-highlight-color: transparent; }
			.btn { display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 54px; padding: 10px 16px; border: 2px solid; text-align: center; color: white; font-size: 18px; line-height: 1.5; text-decoration: none; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.18); overflow-wrap: anywhere; }
			.green { background: #3a7a25; border-color: #1d3d12; }
			.blue { background: #2f5f9e; border-color: #183459; }
			.gray { background: #4a5566; border-color: #262d38; }
			.btn:hover:not(:disabled) { filter: brightness(1.12); }
			.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 4px 0 rgba(0,0,0,.35), inset 0 -2px 0 rgba(255,255,255,.18); }
			.btn:disabled { opacity: .45; cursor: not-allowed; }
			.btn.outline { min-height: 36px; padding: 6px 12px; font-size: 14px; background: transparent; border: 1px solid rgba(255,255,255,.3); box-shadow: none; flex-shrink: 0; }
			:focus-visible { outline: 3px solid #ffd45c; outline-offset: 2px; }
			h2[tabindex="-1"]:focus { outline: none; }
			.heading-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
			.error { color: #ff9a9a; }
			.error:empty { display: none; }
			.muted, small, .world-info p { color: #c3cedd; }
			small, .small { font-size: 12px; }
			hr { border: 0; border-top: 1px solid rgba(255,255,255,.2); margin: 2px 0; width: 100%; }
			form, label { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
			label { gap: 8px; font-weight: 500; }
			input, select { width: 100%; min-width: 0; padding: 10px 12px; min-height: 44px; background: rgba(5,10,18,.75); color: #f4f7fb; border: 1px solid rgba(255,255,255,.4); }
			.captcha { width: 100%; min-width: 0; }
			.badge { font-family: "M PLUS 1p", "Hiragino Sans", sans-serif; font-size: 11px; padding: 2px 7px; background: rgba(0,0,0,.25); }
			#user { position: absolute; right: 24px; top: 24px; display: flex; gap: 10px; align-items: center; max-width: min(360px, calc(100% - 48px)); overflow-wrap: anywhere; }
			#user:empty { display: none; }
			#user > div { min-width: 0; }
			#user strong, #user small { display: block; }
			.avatar { display: grid; place-items: center; flex: 0 0 40px; height: 40px; background: #6b8f3a; font-size: 22px; }
			.world-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
			.btn.world-card { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 8px; padding: 0 0 12px; min-width: 0; background: rgba(10,15,24,.84); border: 3px solid rgba(255,255,255,.14); box-shadow: none; transition: transform .18s; }
			.world-card[aria-pressed="true"] { border-color: #7cc35a; }
			.btn.world-card:hover { transform: translateY(-4px); }
			.thumbnail { display: block; height: 104px; background-image: url(/title-bg.jpg); background-size: 420%; }
			.world-name { font-size: 18px; padding: 0 8px; overflow-wrap: anywhere; }
			.btn.create-card { border-style: dashed; justify-content: center; min-height: 174px; padding: 16px; }
			.world-detail { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
			.world-detail:empty { display: none; }
			.world-info { min-width: 0; }
			.actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
			.member-list { list-style: none; padding: 0; margin: 0; max-height: 50vh; overflow-y: auto; }
			.member-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.15); }
			.member-list li > span { min-width: 0; overflow-wrap: anywhere; }
			.member-list small { display: block; }
			.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
			@media (max-width: 600px) {
				main { padding: 32px 16px 40px; gap: 28px; justify-content: flex-start; }
				#user { position: static; max-width: 100%; align-self: flex-end; }
				.panel { padding: 20px; }
				.subtitle { letter-spacing: 2px; }
				.world-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
				.thumbnail { height: 72px; }
				.world-name { font-size: 15px; }
				.btn.create-card { min-height: 120px; }
				.world-detail { flex-direction: column; align-items: stretch; }
				.actions { flex-wrap: wrap; }
				.actions > .green { flex: 1; }
				.heading-row { flex-wrap: wrap; }
			}
			@media (prefers-reduced-motion: reduce) {
				.background, .swap { animation: none; }
				.btn.world-card { transition: none; }
				.btn.world-card:hover { transform: none; }
			}
		</style>
		<script type="module" src="/src/client/title.ts"></script>
	</head>
	<body>
		<div class="background" aria-hidden="true"></div>
		<div class="shade" aria-hidden="true"></div>
		<main id="title">
			<div id="user"></div>
			<header class="logo">
				<h1>cf-minecraft</h1>
				<p class="subtitle">ブラウザで遊ぶボクセルの世界</p>
			</header>
			<section id="panel" class="panel" aria-label="タイトルメニュー"></section>
		</main>
		<p id="status" class="sr-only" role="status"></p>
	</body>
</html>
