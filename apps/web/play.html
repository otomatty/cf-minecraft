<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>cf-minecraft</title>
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;500;700&display=swap" />
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #c0d8ff;
				font-family: "M PLUS 1p", "Hiragino Sans", sans-serif;
			}
			#view {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
			}
			#hud {
				font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK JP", monospace;
				position: fixed;
				top: 6px;
				left: 6px;
				margin: 0;
				padding: 4px 6px;
				font-size: 13px;
				line-height: 1.35;
				color: #fff;
				background: rgba(0, 0, 0, 0.45);
				white-space: pre;
				pointer-events: none;
			}
			#crosshair {
				position: fixed;
				left: 50%;
				top: 50%;
				width: 18px;
				height: 18px;
				transform: translate(-50%, -50%);
				pointer-events: none;
				mix-blend-mode: difference;
			}
			#crosshair::before,
			#crosshair::after {
				content: "";
				position: absolute;
				background: #fff;
			}
			#crosshair::before {
				left: 8px;
				top: 0;
				width: 2px;
				height: 18px;
			}
			#crosshair::after {
				left: 0;
				top: 8px;
				width: 18px;
				height: 2px;
			}
			#hotbar {
				position: fixed;
				left: 50%;
				bottom: 10px;
				transform: translateX(-50%);
				display: flex;
				gap: 2px;
				padding: 2px;
				background: rgba(0, 0, 0, 0.5);
				pointer-events: none;
			}
			#hotbar canvas {
				width: 40px;
				height: 40px;
				image-rendering: pixelated;
				border: 3px solid #555;
				box-sizing: content-box;
			}
			#hotbar canvas.selected {
				border-color: #fff;
			}
			#overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.5); backdrop-filter: blur(3px); color: #fff; font-family: "M PLUS 1p", sans-serif; font-size: 14px; line-height: 1.7; }
			#overlay [hidden], #overlay[hidden] { display: none; }
			.menu-panel { box-sizing: border-box; width: 440px; max-width: calc(100vw - 32px); max-height: 90vh; overflow-y: auto; padding: 26px 30px; background: rgba(12,18,28,.82); border: 2px solid rgba(255,255,255,.2); display: flex; flex-direction: column; gap: 14px; }
			#controls-panel, #settings-panel { width: 780px; }
			#start-panel { width: auto; }
			#overlay h2, #overlay h3, #status, #overlay button, kbd { font-family: "DotGothic16", monospace; font-weight: 400; }
			#overlay h2, #status { margin: 0; font-size: 24px; }
			#status.error { font-family: "M PLUS 1p", sans-serif; font-size: 14px; }
			#overlay h3 { margin: 0 0 8px; font-size: 18px; }
			#overlay p { margin: 0; }
			#overlay .error { color: #ff9a9a; white-space: pre-wrap; }
			.btn { display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 54px; padding: 10px 16px; border: 2px solid; text-align: center; color: white; font-family: "DotGothic16", monospace; font-size: 18px; line-height: 1.5; text-decoration: none; cursor: pointer; box-sizing: border-box; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.18); overflow-wrap: anywhere; }
			.green { background: #3a7a25; border-color: #1d3d12; }
			.gray { background: #4a5566; border-color: #262d38; }
			.btn:hover:not(:disabled) { filter: brightness(1.12); }
			.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 4px 0 rgba(0,0,0,.35), inset 0 -2px 0 rgba(255,255,255,.18); }
			.btn:disabled { opacity: .45; cursor: not-allowed; }
			.btn.outline { min-height: 36px; padding: 6px 12px; font-size: 14px; background: transparent; border: 1px solid rgba(255,255,255,.3); box-shadow: none; }
			.btn.small { min-height: 44px; font-size: 15px; padding: 8px 10px; white-space: nowrap; }
			#overlay :focus-visible { outline: 3px solid #ffd45c; outline-offset: 2px; }
			.two-columns, #key-bindings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
			#key-bindings { gap: 6px 30px; }
			.panel-actions { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
			#overlay hr { border: 0; border-top: 1px solid rgba(255,255,255,.2); margin: 2px 0; width: 100%; }
			#menu-world, #menu-hint, .controls-note { font-size: 12px; color: #c3cedd; }
			.world-kind { display: inline-block; font-size: 11px; border: 1px solid #6c7686; padding: 0 5px; margin-left: 8px; }
			#menu-message:empty, #archive-status:empty { display: none; }
			#key-bindings label, #mouse-tab-panel label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0; }
			#key-bindings label { margin: 0; }
			#key-bindings .btn { min-width: 100px; min-height: 36px; padding: 6px 12px; font-size: 14px; }
			#settings-warning { color: #ffcf80; min-height: 1.7em; }
			[role="tablist"] { display: flex; gap: 4px; border-bottom: 2px solid rgba(255,255,255,.2); }
			[role="tab"] { background: transparent; border: 0; box-shadow: none; color: #c3cedd; font-family: "DotGothic16", monospace; font-size: 16px; padding: 8px 18px; border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; }
			[role="tab"][aria-selected="true"] { color: #fff; border-bottom-color: #7cc35a; }
			#controls-panel dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 0; }
			#controls-panel dd { margin: 0; }
			kbd { display: inline-block; padding: 0 5px; border: 1px solid #6c7686; border-radius: 3px; background: #3a4352; box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
			@media (max-width: 639px) { .two-columns, #key-bindings { grid-template-columns: 1fr; } .menu-panel { padding: 26px 20px; } }
			#block-picker {
				position: fixed;
				inset: 8vh 10vw;
				padding: 20px;
				background: #222e;
				color: white;
				overflow: auto;
				border: 2px solid #888;
			}
			#block-picker[hidden] { display: none; }
			#block-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
			#block-grid button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; color: white; background: #333; border: 1px solid #888; cursor: pointer; }
			#block-grid button:focus-visible { outline: 3px solid white; }
			#block-grid canvas { width: 40px; height: 40px; image-rendering: pixelated; }
			#block-grid span { overflow-wrap: anywhere; }

		</style>
	</head>
	<body>
		<canvas id="view"></canvas>
		<pre id="hud">読み込み中…</pre>
		<div id="crosshair"></div>
		<div id="hotbar"></div>
		<div id="overlay">
			<section id="start-panel" class="menu-panel">
				<p id="status">読み込み中…</p>
				<p><kbd>Esc</kbd> でメニュー（操作方法・設定・タイトルへ戻る）</p>
			</section>
			<section id="game-menu" class="menu-panel" role="dialog" aria-labelledby="game-menu-title" hidden>
				<h2 id="game-menu-title">ゲームメニュー</h2>
				<button id="menu-resume" class="btn green" type="button">ゲームに戻る</button>
				<div class="two-columns">
					<button id="menu-controls" class="btn gray" type="button">操作方法</button>
					<button id="settings-open" class="btn gray" type="button">設定…</button>
				</div>
				<hr />
				<div id="world-archive" hidden>
					<div class="two-columns">
						<button id="world-export" class="btn gray small" type="button">ワールドを書き出す</button>
						<button id="world-import" class="btn gray small" type="button">ワールドを読み込む</button>
					</div>
					<input id="world-file" type="file" accept=".mcworld" hidden />
					<p id="archive-status" role="status" aria-live="polite"></p>
				</div>
				<a id="to-title" class="btn gray" href="/">タイトルに戻る</a>
				<p id="menu-message" role="status"></p>
				<p id="menu-hint"><span id="menu-world"></span><br />画面のどこかをクリックしても再開できます</p>
			</section>
			<section id="controls-panel" class="menu-panel" hidden>
				<h2>操作方法</h2>
				<div id="controls-groups" class="two-columns"></div>
				<div class="panel-actions">
					<button id="controls-to-settings" class="btn outline" type="button">キー割り当てを変更…</button>
					<button id="controls-close" class="btn green" type="button">完了</button>
				</div>
			</section>
			<section id="settings-panel" class="menu-panel" hidden aria-labelledby="settings-title">
				<h2 id="settings-title">設定</h2>
				<div role="tablist" aria-label="設定の種類">
					<button id="keys-tab" type="button" role="tab" aria-selected="true" aria-controls="keys-tab-panel">キー割り当て</button>
					<button id="mouse-tab" type="button" role="tab" aria-selected="false" aria-controls="mouse-tab-panel" tabindex="-1">マウス・視点</button>
				</div>
				<div id="keys-tab-panel" role="tabpanel" aria-labelledby="keys-tab">
					<div id="key-bindings"></div>
					<p>項目をクリックして次に押すキーを割り当てます。Esc で取り消し。</p>
					<p>R は全画面の Keyboard Lock 成功時に左 Ctrl に切り替わります。Ctrl の指定はロックがない間 R になります。前進キーの2回押しでもダッシュできます。</p>
					<p id="settings-warning" role="status" aria-live="polite"></p>
				</div>
				<div id="mouse-tab-panel" role="tabpanel" aria-labelledby="mouse-tab" hidden>
					<label>マウス感度 <span><input id="sensitivity" type="range" min="0" max="200" step="1" /><output id="sensitivity-value"></output></span></label>
					<label>視野角（縦） <span><input id="fov" type="range" min="30" max="110" step="1" /><output id="fov-value"></output></span></label>
				</div>
				<div class="panel-actions">
					<button id="settings-reset" class="btn outline" type="button">既定に戻す</button>
					<button id="settings-close" class="btn green" type="button">完了</button>
				</div>
			</section>
		</div>
		<div id="block-picker" role="dialog" aria-modal="true" aria-labelledby="block-picker-title" hidden>
			<h2 id="block-picker-title">ブロック選択</h2>
			<p>クリックで現在のホットバー枠に設定。E / Esc で閉じます。</p>
			<div id="block-grid"></div>
			<button id="block-picker-close" type="button">閉じて再開</button>
		</div>
		<script type="module" src="/src/client/main.ts"></script>
	</body>
</html>
