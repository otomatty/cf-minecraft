name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. A job that needs more asks for it itself.
permissions:
  contents: read

# A new commit on a pull request cancels the run for the previous one.
# Runs on main are not interrupted and run one at a time, but GitHub does not
# guarantee their order: the `deploy` job checks that again for itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Naming bash explicitly turns on `-eo pipefail`.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # README: Node.js 22.18 or later.
  NODE_VERSION: "22"
  # No usage telemetry from the cf CLI in CI.
  CF_SEND_TELEMETRY: "false"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the version, components and targets named in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc -Vv

      - name: cargo fmt
        run: cargo fmt --all --check

      # Later steps still run after a failure, so one push reports everything.
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked

  build:
    name: Build (WASM, TypeScript, determinism)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc -Vv
          rustup target list --installed

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM
        run: pnpm build:wasm

      - name: Typecheck
        run: pnpm typecheck

      - name: Host tests
        run: pnpm test:host

      - name: Build native server
        run: cargo build --release --locked -p native-server

      - name: Determinism (native, Node)
        run: pnpm check:determinism

      - name: Production build
        run: pnpm --filter web build

      # Validates the Build Output that the `deploy` job uploads on main.
      # Sends nothing and needs no credentials, so it also runs for forks.
      - name: Deploy check (dry run)
        working-directory: apps/web
        run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      # Uploaded before the dev server starts, so it is exactly the production build.
      - name: Upload Build Output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: apps/web/.cloudflare/output
          # .cloudflare is a hidden directory; without this nothing is uploaded.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Start dev server
        run: .github/scripts/start-dev-server.sh

      - name: Determinism (native, Node, workerd Durable Object)
        run: pnpm check:determinism --edge http://localhost:5173

      - name: Dev server log
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/dev-server.log" || true

  e2e:
    name: E2E (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc -Vv

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM
        run: pnpm build:wasm

      - name: Start dev server
        run: .github/scripts/start-dev-server.sh

      # Chrome needs a window for WebGPU on a software rasterizer; see tools/e2e.mjs.
      - name: End-to-end checks
        run: xvfb-run -a -s "-screen 0 1280x720x24" node tools/e2e.mjs --shots "$RUNNER_TEMP/shots"

      - name: Upload screenshots and dev server log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/dev-server.log
          if-no-files-found: ignore
          retention-days: 7

  # The one check to mark as required in branch protection. It stays the same
  # when jobs are added or renamed. `always()` matters: without it this job is
  # skipped when a needed job fails, and a skipped check counts as passing.
  required:
    name: required
    if: ${{ always() }}
    needs: [rust, build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  # Deploys the Build Output from the `build` job: built once, checked by every
  # required job, then uploaded as it is. Nothing is rebuilt here.
  #
  # Off until the repository variable DEPLOY_ENABLED is set to "true"
  # (Settings > Secrets and variables > Actions > Variables), so merging this
  # workflow deploys nothing by itself. See "自動公開" in README.md.
  deploy:
    name: Deploy to Cloudflare
    needs: [required]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Secrets stored on this environment reach only this job.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Installs the cf CLI at the version in the lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: apps/web/.cloudflare/output

      # Runs in a concurrency group can start out of order, and an old run can
      # be re-run by hand. Either would put older code back into production, so
      # deploy only while this commit is still what main points at.
      - name: Check that this commit is the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: main is at $tip, this run built $GITHUB_SHA."
          fi

      # --mode must be the mode the build recorded (production). The tag and
      # message make the Worker version traceable to the commit and the run.
      - name: Deploy
        if: ${{ steps.tip.outputs.current == 'true' }}
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec cf deploy --prebuilt --mode production --tag "${GITHUB_SHA::7}" --message "GitHub Actions run $GITHUB_RUN_ID, commit $GITHUB_SHA"
